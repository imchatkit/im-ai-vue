name: Vue前端CI/CD流水线

on:
  push:
    branches: [ dev, main, master ]
  # pull_request:
  #   branches: [ dev, main, master ]

env:
  DOCKER_REGISTRY: useccr.ccs.tencentyun.com
  DOCKER_NAMESPACE: vue-im-ai
  NODE_VERSION: '18'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmmirror.com/

      # 缓存依赖加速构建
      - name: 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装依赖
        run: |
          npm install -g cnpm
          export ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/"
          export ELECTRON_BUILDER_BINARIES_MIRROR="https://npmmirror.com/mirrors/electron-builder-binaries/"
          export ELECTRON_CUSTOM_DIR="{{ version }}"
          export ELECTRON_SKIP_BINARY_DOWNLOAD=0
          # 增加重试机制
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            cnpm install && break
            RETRY_COUNT=$[$RETRY_COUNT+1]
            echo "安装失败，正在重试 ($RETRY_COUNT/$MAX_RETRIES)..."
            rm -rf node_modules
            sleep 5
          done
          
          if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
            echo "安装依赖失败，已达最大重试次数"
            exit 1
          fi

      - name: 构建项目
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
          retention-days: 7

  docker-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: ./dist

      # 创建nginx配置文件
      - name: 创建Nginx配置文件
        run: |
          mkdir -p nginx
          cat > nginx/default.conf << 'EOF'
          server {
              listen       80;
              server_name  localhost;

              location / {
                  root   /usr/share/nginx/html;
                  index  index.html index.htm;
                  try_files $uri $uri/ /index.html;
              }

              error_page   500 502 503 504  /50x.html;
              location = /50x.html {
                  root   /usr/share/nginx/html;
              }
          }
          EOF

      # 创建Dockerfile
      - name: 创建Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM nginx:alpine
          COPY dist/ /usr/share/nginx/html/
          COPY nginx/default.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/im-ai-vue:${{ github.sha }}

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      
      - name: 复制部署文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deploy.sh"
          target: "/home/${{ secrets.SSH_USERNAME }}/im-ai-vue-deploy"
          overwrite: true
          
      - name: SSH部署
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===开始执行部署脚本==="
            cd /home/${{ secrets.SSH_USERNAME }}/im-ai-vue-deploy
            chmod +x deploy.sh
            
            # 设置环境变量
            export DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
            export DOCKER_NAMESPACE=${{ env.DOCKER_NAMESPACE }}
            export REGISTRY_USERNAME=${{ secrets.TENCENT_REGISTRY_USERNAME }}
            export REGISTRY_PASSWORD=${{ secrets.TENCENT_REGISTRY_PASSWORD }}
            export IMAGE_TAG=${{ github.sha }}
            
            echo "登录到腾讯云容器服务..."
            # 使用-p而不是--password-stdin以避免管道问题
            docker login $DOCKER_REGISTRY -u $REGISTRY_USERNAME -p $REGISTRY_PASSWORD
            
            echo "拉取最新镜像: $DOCKER_REGISTRY/$DOCKER_NAMESPACE/im-ai-vue:$IMAGE_TAG"
            docker pull $DOCKER_REGISTRY/$DOCKER_NAMESPACE/im-ai-vue:$IMAGE_TAG
            
            if [ $? -ne 0 ]; then
              echo "❌ 镜像拉取失败，退出部署"
              exit 1
            fi
            
            # 使用Docker Compose部署
            echo "创建docker-compose.override.yml..."
            cat > docker-compose.override.yml << EOF
            version: '3'
            services:
              im-ai-vue:
                image: $DOCKER_REGISTRY/$DOCKER_NAMESPACE/im-ai-vue:$IMAGE_TAG
                restart: always
                ports:
                  - "80:80"
                environment:
                  - TZ=Asia/Shanghai
            EOF
            
            # 执行部署脚本
            echo "执行部署脚本..."
            bash ./deploy.sh
            
            # 确认部署状态
            if [ $? -eq 0 ]; then
              echo "✅ 部署成功完成"
            else
              echo "❌ 部署失败"
              exit 1
            fi 