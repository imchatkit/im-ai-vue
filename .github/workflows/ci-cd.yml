name: Vue前端CI/CD流水线

on:
  push:
    branches: [ dev, main, master ]
  # pull_request:
  #   branches: [ dev, main, master ]

env:
  DOCKER_REGISTRY: useccr.ccs.tencentyun.com
  DOCKER_NAMESPACE: vue-im-ai
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmmirror.com/

      # 缓存依赖加速构建
      - name: 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装依赖
        run: |
          npm install -g cnpm
          cnpm install

      - name: 构建项目
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
          retention-days: 7

  docker-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: ./dist

      # 创建nginx配置文件
      - name: 创建Nginx配置文件
        run: |
          mkdir -p nginx
          cat > nginx/default.conf << 'EOF'
          server {
              listen       80;
              server_name  localhost;

              location / {
                  root   /usr/share/nginx/html;
                  index  index.html index.htm;
                  try_files $uri $uri/ /index.html;
              }

              # 接口代理配置
              location /imcore/ {
                  proxy_pass http://im-core-server:8080/imcore/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }

              error_page   500 502 503 504  /50x.html;
              location = /50x.html {
                  root   /usr/share/nginx/html;
              }
          }
          EOF

      # 创建Dockerfile
      - name: 创建Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM nginx:alpine
          COPY dist/ /usr/share/nginx/html/
          COPY nginx/default.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/im-ai-vue:${{ github.sha }}

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      
      - name: 复制部署文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deploy.sh"
          target: "/home/${{ secrets.SSH_USERNAME }}/im-ai-vue-deploy"
          overwrite: true
          
      - name: SSH部署
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USERNAME }}/im-ai-vue-deploy
            chmod +x deploy.sh
            
            # 确保Docker Compose已安装
            if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
              echo "正在安装Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.26.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi
            
            # 设置环境变量
            export DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
            export DOCKER_NAMESPACE=${{ env.DOCKER_NAMESPACE }}
            export REGISTRY_USERNAME=${{ secrets.TENCENT_REGISTRY_USERNAME }}
            export REGISTRY_PASSWORD=${{ secrets.TENCENT_REGISTRY_PASSWORD }}
            
            # 登录到腾讯云容器服务
            echo $REGISTRY_PASSWORD | docker login $DOCKER_REGISTRY -u $REGISTRY_USERNAME --password-stdin
            
            # 拉取最新镜像
            docker pull $DOCKER_REGISTRY/$DOCKER_NAMESPACE/im-ai-vue:${{ github.sha }}
            
            # 使用Docker Compose部署
            cat > docker-compose.override.yml << EOF
            version: '3'
            services:
              im-ai-vue:
                image: $DOCKER_REGISTRY/$DOCKER_NAMESPACE/im-ai-vue:${{ github.sha }}
                restart: always
                ports:
                  - "80:80"
                environment:
                  - TZ=Asia/Shanghai
            EOF
            
            # 启动服务
            docker-compose up -d
            
            # 清理旧镜像，保留最近3个版本
            echo "清理旧镜像..."
            image_ids=$(docker images ${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/im-ai-vue --format "{{.ID}}" | tail -n +4)
            if [ ! -z "$image_ids" ]; then
              echo "清理im-ai-vue的旧镜像: $image_ids"
              docker rmi $image_ids 2>/dev/null || true
            fi 